name: Test Sketchfab download API

on:
  push:
    branches: [interactive-music-desk-models]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test anonymous model downloads
        shell: bash
        run: |
          set -x
          for id in 5d8aea0a780b49fa89c9c205912414e3 8ee3f06179d24078bf39a44e0bd9ae7a; do
            curl -sS -D headers.txt -o body.txt "https://api.sketchfab.com/v3/models/$id/download" || true
            cat headers.txt
            head -c 1000 body.txt || true
            echo
          done
